name: Appka

# Pri zmene appky: typová kontrola + build, potom Playwright testy
# (E2E na mobile aj desktope, prístupnosť cez axe, vizuálna regresia 6 obrazoviek).
# Ručné spustenie so „snimky“ na vetve (nie main): testy prebehnú a nové vizuálne snímky
# z prehliadača CI sa uložia commitom do tej vetvy. Snímky sa robia len tu, lokálny prehliadač kreslí inak.
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:
    inputs:
      snimky:
        description: "Aktualizovať vizuálne snímky a uložiť ich do vetvy (nie na main)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.snimky || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04 # pevná verzia: ubuntu-latest sa od 19. 10. mení na Ubuntu 26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Knižnice
        run: npm ci

      - name: Prehliadač pre testy
        run: npx playwright install --with-deps chromium

      - name: Testy (E2E + a11y + vizuálne)
        run: npx playwright test
        env:
          VISUAL: "1"

      - name: Report pri chybe
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7

  snimky:
    if: ${{ inputs.snimky && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Knižnice
        run: npm ci

      - name: Prehliadač pre testy
        run: npx playwright install --with-deps chromium

      - name: Testy + nové vizuálne snímky
        run: npx playwright test --update-snapshots
        env:
          VISUAL: "1"

      - name: Commit snímok do vetvy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.ts-snapshots
          if git diff --cached --quiet; then echo "Snímky sa nezmenili."; exit 0; fi
          git diff --cached --stat
          git commit -m "Vizuálne snímky z CI (${GITHUB_REF_NAME})"
          git push

      - name: Report pri chybe
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
