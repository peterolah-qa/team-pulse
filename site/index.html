<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Pulse</title>
<meta name="theme-color" content="#050407">
<style>
  :root { --bg:#050407; --card:#120f17; --line:#3a2f45; --text:#e8e4ee; --muted:#8c8398;
          --mag:#ff00a8; --cyan:#00f0ff; --yel:#f0ff00;
          --t0:#39ff14; --t1:#f0ff00; --t2:#ff7a00; --t3:#ff003c; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.4 system-ui, -apple-system, sans-serif;
         padding:16px; max-width:560px; margin:0 auto; }
  header { margin:8px 0 18px; }
  .brand { color:var(--yel); letter-spacing:4px; font-size:11px; font-weight:700; }
  h1 { font-style:italic; text-transform:uppercase; letter-spacing:1px;
       text-shadow:2px 0 var(--cyan), -2px 0 var(--mag); font-size:26px; }
  .meta { color:var(--muted); font-size:12px; margin-top:4px; }
  h2 { color:var(--cyan); font-size:12px; letter-spacing:3px; margin:18px 0 8px; }
  .game { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--mag);
          padding:12px 14px; margin-bottom:10px;
          clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px)); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .team { font-weight:800; font-size:17px; width:48px; }
  .tier { font-size:11px; font-weight:800; letter-spacing:1px; padding:2px 8px;
          clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%); }
  .pulse { font-weight:800; font-size:20px; width:44px; text-align:right; }
  .reasons { color:var(--muted); font-size:12.5px; margin:2px 0 8px 56px; }
  .bar { height:5px; background:#1f1a26; margin:8px 0 4px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--mag),var(--cyan)); }
  .small { color:var(--muted); font-size:12px; }
  footer { color:var(--muted); font-size:11px; margin:24px 0; }
</style>
</head>
<body>
<header>
  <div class="brand">TEAM PULSE</div>
  <h1>Najbližšie zápasy</h1>
  <div class="meta" id="meta">načítavam…</div>
</header>
<main id="app"></main>
<footer>Neoficiálny osobný projekt, bez spojenia s NBA. Štatistické zhrnutie stavu teamov, nie predpoveď výsledku.</footer>
<script>
const TIERS = { "Silný":"--t0", "Stabilný":"--t1", "Oslabený":"--t2", "Kritický":"--t3" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function teamRow(s) {
  const c = `var(${TIERS[s.tier]})`;
  const drop = s.dropped ? ` <span class="small">(normálne ${esc(s.normal_tier)})</span>` : "";
  const reasons = s.reasons.map(([t, e]) => `${e > 0 ? "+" : ""}${e} ${esc(t)}`).join(" · ");
  return `<div class="row"><span class="team">${esc(s.team)}</span>
      <span class="tier" style="color:${c};background:color-mix(in srgb, ${c} 14%, transparent)">${esc(s.tier.toUpperCase())}</span>${drop}
      <span class="small" style="margin-left:auto">istota ${esc(s.confidence)}</span>
      <span class="pulse" style="color:${c}">${Math.round(s.pulse)}</span></div>
    ${reasons ? `<div class="reasons">${reasons}</div>` : ""}`;
}

function game(g) {
  const t = new Date(g.tipoff_utc);
  const time = isNaN(t) ? "" : t.toLocaleTimeString("sk-SK", { hour:"2-digit", minute:"2-digit" });
  const p = Math.round(g.p_home * 100);
  return `<div class="game">
    <div class="row small"><span>${time}${g.neutral ? " · neutrálne ihrisko" : ""}</span></div>
    ${teamRow(g.home)}${teamRow(g.away)}
    <div class="bar"><i style="width:${p}%"></i></div>
    <div class="row small"><span>${esc(g.home.team)} ${p} %</span>
      <span>rozdiel ${g.margin_home > 0 ? "+" : ""}${g.margin_home}</span>
      <span>${100 - p} % ${esc(g.away.team)}</span></div></div>`;
}

fetch("data/predictions.json", { cache:"no-store" })
  .then(r => r.json())
  .then(d => {
    const gen = new Date(d.generated_at).toLocaleString("sk-SK");
    document.getElementById("meta").textContent =
      `aktualizované ${gen} · model ${d.model} · posledný výsledok ${d.last_result}`;
    const days = Object.entries(d.days);
    document.getElementById("app").innerHTML = days.length
      ? days.map(([day, gs]) => `<h2>// ${esc(day)}</h2>` + gs.map(game).join("")).join("")
      : `<p class="small">Žiadne naplánované zápasy.</p>`;
  })
  .catch(() => { document.getElementById("meta").textContent = "Predpovede sa nepodarilo načítať."; });
</script>
</body>
</html>
